<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, Sarah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#ffd84d; --ink:#1b2a6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  main { text-align: left; max-width: 900px; }
  h1 {
    font-size: clamp(3.5rem, 18vw, 11rem);
    font-weight: 800;
    line-height: .9;
    letter-spacing: -0.04em;
    margin: 0 0 .25em;
  }
  p { font-size: clamp(1.1rem, 3vw, 1.6rem); margin: 0 0 1.5em; max-width: 30ch; }
  .likes { list-style: none; padding: 0; margin: 0 0 1.75em; font-size: clamp(1rem, 2.6vw, 1.35rem); }
  .likes li { margin: 0 0 .5em; }
  button {
    font: inherit;
    font-weight: 800;
    background: var(--ink);
    color: var(--bg);
    border: 0;
    border-radius: 999px;
    padding: .8em 1.6em;
    cursor: pointer;
  }
  button:hover { transform: rotate(-2deg); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .hint { margin: 2.5em 0 .75em; font-size: 1rem; }
  #game { display: block; width: min(100%, 320px); height: auto; aspect-ratio: 2 / 3; border-radius: 16px; border: 3px solid var(--ink); background: #9ddf9b; touch-action: none; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { button:hover { transform: none; } }
</style>
</head>
<body>
<main>
  <h1 id="greeting">Hello, Sarah.</h1>
  <p>Someone built this page just to say hi. Hope your day is a good one.</p>
  <ul class="likes">
    <li>🐶 Dogs get a hello, a head scratch, and a treat.</li>
    <li>🐱 Cats get a hello too, on their own terms.</li>
    <li>🍺 First round at Coors Brewery is on the internet.</li>
  </ul>
  <button id="again" type="button">Say it again</button>
  <p class="hint">Bored? Tap the box to flap. Don’t hit the pipes.</p>
  <canvas id="game" aria-label="Flappy bird game. Tap or press space to flap."></canvas>
</main>
<script>
  const greetings = [
    "Hello", "Hola", "Bonjour", "Ciao", "Hallo", "Olá",
    "Salut", "Hej", "Shalom", "Aloha", "Konnichiwa", "Namaste"
  ];
  let i = 0;
  document.getElementById("again").addEventListener("click", () => {
    i = (i + 1) % greetings.length;
    document.getElementById("greeting").textContent = greetings[i] + ", Sarah.";
  });

  (() => {
    const c = document.getElementById("game"), ctx = c.getContext("2d");
    const W = 320, H = 480, GRAV = 0.45, FLAP = -7.2, GAP = 130, PW = 52, SPEED = 2.2, R = 12;
    const dpr = window.devicePixelRatio || 1;
    c.width = W * dpr; c.height = H * dpr;
    ctx.scale(dpr, dpr);
    const INK = "#1b2a6b", FONT = '"Bricolage Grotesque", system-ui, sans-serif';
    let bird, pipes, score, frame, state = "ready", overAt = 0, best = 0;
    try { best = +localStorage.getItem("sarahFlappyBest") || 0; } catch (e) {}

    function reset() { bird = { x: 80, y: H / 2, v: 0 }; pipes = []; score = 0; frame = 0; }
    reset();

    function flap() {
      if (state === "over") {
        if (performance.now() - overAt < 400) return;
        reset(); state = "ready"; return;
      }
      if (state === "ready") state = "play";
      bird.v = FLAP;
    }

    function die() {
      state = "over"; overAt = performance.now();
      if (score > best) {
        best = score;
        try { localStorage.setItem("sarahFlappyBest", best); } catch (e) {}
      }
    }

    function update() {
      frame++;
      if (state === "ready") { bird.y = H / 2 + Math.sin(frame / 15) * 6; return; }
      if (state !== "play") return;
      bird.v += GRAV; bird.y += bird.v;
      if (frame % 90 === 1) pipes.push({ x: W, top: 50 + Math.random() * (H - GAP - 100), scored: false });
      for (const p of pipes) {
        p.x -= SPEED;
        if (!p.scored && p.x + PW < bird.x) { p.scored = true; score++; }
        if (bird.x + R > p.x && bird.x - R < p.x + PW && (bird.y - R < p.top || bird.y + R > p.top + GAP)) die();
      }
      pipes = pipes.filter(p => p.x > -PW);
      if (bird.y - R < 0 || bird.y + R > H) die();
    }

    function label(text, y, size) {
      ctx.fillStyle = INK; ctx.textAlign = "center";
      ctx.font = "800 " + size + "px " + FONT;
      ctx.fillText(text, W / 2, y);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#7fd18b"); sky.addColorStop(1, "#c6efb0");
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#6cc07a";
      ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, H - 70);
      ctx.quadraticCurveTo(80, H - 130, 170, H - 80); ctx.quadraticCurveTo(250, H - 40, W, H - 90);
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#4fae66";
      ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, H - 35);
      ctx.quadraticCurveTo(100, H - 75, 200, H - 40); ctx.quadraticCurveTo(270, H - 20, W, H - 45);
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = INK;
      for (const p of pipes) {
        const by = p.top + GAP;
        ctx.fillStyle = "#1f7a45";
        ctx.fillRect(p.x, -3, PW, p.top + 3); ctx.strokeRect(p.x, -3, PW, p.top + 3);
        ctx.fillRect(p.x - 5, p.top - 18, PW + 10, 18); ctx.strokeRect(p.x - 5, p.top - 18, PW + 10, 18);
        ctx.fillRect(p.x, by, PW, H - by + 3); ctx.strokeRect(p.x, by, PW, H - by + 3);
        ctx.fillRect(p.x - 5, by, PW + 10, 18); ctx.strokeRect(p.x - 5, by, PW + 10, 18);
        ctx.fillStyle = "rgba(255,255,255,.18)";
        ctx.fillRect(p.x + 8, 0, 6, p.top - 18); ctx.fillRect(p.x + 8, by + 18, 6, H - by - 18);
      }
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(Math.max(-0.5, Math.min(1, bird.v / 10)));
      ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.lineWidth = 2.5; ctx.strokeStyle = INK;
      // feet
      ctx.strokeStyle = "#f7a21b";
      ctx.beginPath(); ctx.moveTo(-3, 11); ctx.lineTo(-3, 17); ctx.moveTo(4, 11); ctx.lineTo(4, 17); ctx.stroke();
      ctx.strokeStyle = INK;
      // tail feathers
      ctx.fillStyle = "#e5533d";
      ctx.beginPath(); ctx.moveTo(-14, -2); ctx.lineTo(-28, -9); ctx.lineTo(-25, -1); ctx.lineTo(-29, 5); ctx.lineTo(-14, 5); ctx.closePath(); ctx.fill(); ctx.stroke();
      // head crest
      ctx.fillStyle = "#e5533d";
      ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(-2, -20); ctx.lineTo(3, -14); ctx.lineTo(6, -21); ctx.lineTo(8, -11); ctx.closePath(); ctx.fill(); ctx.stroke();
      // body
      ctx.fillStyle = "#ff6b4a";
      ctx.beginPath(); ctx.ellipse(0, 0, 17, 13, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffe3a3";
      ctx.beginPath(); ctx.ellipse(3, 4, 11, 8, 0, 0, Math.PI); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, 0, 17, 13, 0, 0, Math.PI * 2); ctx.stroke();
      // wing
      const wa = state === "play" ? Math.sin(frame / 3) * 0.6 : Math.sin(frame / 8) * 0.3;
      ctx.save(); ctx.translate(-5, 1); ctx.rotate(wa);
      ctx.fillStyle = "#ff9a5a";
      ctx.beginPath(); ctx.ellipse(-3, 0, 11, 6, -0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
      // beak
      ctx.fillStyle = "#ffb02e";
      ctx.beginPath(); ctx.moveTo(14, -3); ctx.lineTo(26, 1); ctx.lineTo(14, 5); ctx.closePath(); ctx.fill(); ctx.stroke();
      // cheek, eye
      ctx.fillStyle = "rgba(255,120,150,.6)";
      ctx.beginPath(); ctx.arc(8, 4, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(8, -5, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(9.5, -5, 2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      if (state === "play") label(String(score), 56, 44);
      if (state === "ready") { label("Tap to start", 150, 28); label("Best: " + best, 185, 18); }
      if (state === "over") {
        label("Game over", 190, 34);
        label("Score " + score + " \u2022 Best " + best, 225, 18);
        label("Tap to try again", 258, 18);
      }
    }

    let last = performance.now(), acc = 0;
    const STEP = 1000 / 60;
    function loop(now) {
      acc += Math.min(now - last, 100); last = now;
      while (acc >= STEP) { update(); acc -= STEP; }
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    c.addEventListener("pointerdown", e => { e.preventDefault(); flap(); });
    document.addEventListener("keydown", e => {
      if (e.code === "Space" && e.target === document.body) { e.preventDefault(); flap(); }
      if (e.code === "ArrowUp") { e.preventDefault(); flap(); }
    });
  })();
</script>
</body>
</html>
