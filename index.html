<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, Sarah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#ffd84d; --ink:#1b2a6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  main { text-align: left; max-width: 900px; }
  h1 {
    font-size: clamp(3.5rem, 18vw, 11rem);
    font-weight: 800;
    line-height: .9;
    letter-spacing: -0.04em;
    margin: 0 0 .25em;
  }
  p { font-size: clamp(1.1rem, 3vw, 1.6rem); margin: 0 0 1.5em; max-width: 30ch; }
  .likes { list-style: none; padding: 0; margin: 0 0 1.75em; font-size: clamp(1rem, 2.6vw, 1.35rem); }
  .likes li { margin: 0 0 .5em; }
  button {
    font: inherit;
    font-weight: 800;
    background: var(--ink);
    color: var(--bg);
    border: 0;
    border-radius: 999px;
    padding: .8em 1.6em;
    cursor: pointer;
  }
  button:hover { transform: rotate(-2deg); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .hint { margin: 2.5em 0 .75em; font-size: 1rem; }
  #game { display: block; width: min(100%, 320px); height: auto; aspect-ratio: 2 / 3; border-radius: 16px; border: 3px solid var(--ink); background: #9ddf9b; touch-action: none; cursor: pointer; }
  .mute { margin-top: 1em; font-size: .95rem; }
  @media (prefers-reduced-motion: reduce) { button:hover { transform: none; } }
</style>
</head>
<body>
<main>
  <h1 id="greeting">Hello, Sarah.</h1>
  <p>Someone built this page just to say hi. Hope your day is a good one.</p>
  <ul class="likes">
    <li>🐶 Dogs get a hello, a head scratch, and a treat.</li>
    <li>🐱 Cats get a hello too, on their own terms.</li>
    <li>🍺 First round at Coors Brewery is on the internet.</li>
  </ul>
  <button id="again" type="button">Say it again</button>
  <p class="hint">Bored? Tap the box to flap. Don’t hit the trees.</p>
  <canvas id="game" aria-label="Flappy bird game. Tap or press space to flap."></canvas>
  <button id="mute" class="mute" type="button">🔊 Music on</button>
</main>
<script>
  const greetings = [
    "Hello", "Hola", "Bonjour", "Ciao", "Hallo", "Olá",
    "Salut", "Hej", "Shalom", "Aloha", "Konnichiwa", "Namaste"
  ];
  let i = 0;
  document.getElementById("again").addEventListener("click", () => {
    i = (i + 1) % greetings.length;
    document.getElementById("greeting").textContent = greetings[i] + ", Sarah.";
  });

  (() => {
    const c = document.getElementById("game"), ctx = c.getContext("2d");
    const W = 320, H = 480, GRAV = 0.45, FLAP = -7.2, GAP = 140, PW = 52, SPEED = 2.2, R = 14;
    const dpr = window.devicePixelRatio || 1;
    c.width = W * dpr; c.height = H * dpr;
    ctx.scale(dpr, dpr);
    const INK = "#1b2a6b", FONT = '"Bricolage Grotesque", system-ui, sans-serif';
    let bird, pipes, score, frame, state = "ready", overAt = 0, best = 0;
    try { best = +localStorage.getItem("sarahFlappyBest") || 0; } catch (e) {}

    // ---- silly background music (starts on first tap, browsers require a tap) ----
    let ac = null, master = null, musicOn = true, step = 0, nextT = 0;
    const TEMPO = 0.18;
    const hz = n => 440 * Math.pow(2, (n - 69) / 12);
    const MEL = [
      [72, 0, 76, 72, 79, 0, 79, 0, 77, 76, 74, 72, 74, 0, 67, 0],
      [72, 0, 76, 72, 79, 0, 84, 0, 83, 81, 79, 77, 76, 0, 72, 0]
    ];
    const BASS = [
      [48, 0, 55, 0, 48, 0, 55, 0, 53, 0, 60, 0, 55, 0, 62, 0],
      [48, 0, 55, 0, 52, 0, 59, 0, 53, 0, 60, 0, 55, 0, 48, 0]
    ];
    function tone(type, f, t, d, vol, bend) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f * (bend || 1), t);
      if (bend) o.frequency.exponentialRampToValueAtTime(f, t + 0.04);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.02);
    }
    function boing(t) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(200, t);
      o.frequency.exponentialRampToValueAtTime(900, t + 0.25);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.32);
    }
    function schedule() {
      while (nextT < ac.currentTime + 0.3) {
        const bar = Math.floor(step / 16) % 2, s = step % 16;
        const m = MEL[bar][s], b = BASS[bar][s];
        if (m) tone("square", hz(m), nextT, TEMPO * 0.9, 0.07, 0.94);
        if (b) tone("triangle", hz(b), nextT, TEMPO * 1.6, 0.22);
        if (bar === 1 && s === 15) boing(nextT);
        nextT += TEMPO; step++;
      }
    }
    function startMusic() {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ac = new AC();
        master = ac.createGain();
        master.gain.value = musicOn ? 0.6 : 0;
        master.connect(ac.destination);
        nextT = ac.currentTime + 0.05;
        setInterval(schedule, 100);
      }
      if (ac.state === "suspended") ac.resume();
    }
    const muteBtn = document.getElementById("mute");
    muteBtn.addEventListener("click", () => {
      musicOn = !musicOn;
      muteBtn.textContent = musicOn ? "🔊 Music on" : "🔇 Music off";
      if (master) master.gain.value = musicOn ? 0.6 : 0;
      if (musicOn) startMusic();
    });
    document.addEventListener("visibilitychange", () => {
      if (!ac) return;
      if (document.hidden) ac.suspend();
      else if (musicOn) ac.resume();
    });

    function reset() { bird = { x: 80, y: H / 2, v: 0 }; pipes = []; score = 0; frame = 0; }
    reset();

    function flap() {
      startMusic();
      if (state === "over") {
        if (performance.now() - overAt < 400) return;
        reset(); state = "ready"; return;
      }
      if (state === "ready") state = "play";
      bird.v = FLAP;
    }

    function die() {
      state = "over"; overAt = performance.now();
      if (score > best) {
        best = score;
        try { localStorage.setItem("sarahFlappyBest", best); } catch (e) {}
      }
    }

    function update() {
      frame++;
      if (state === "ready") { bird.y = H / 2 + Math.sin(frame / 15) * 6; return; }
      if (state !== "play") return;
      bird.v += GRAV; bird.y += bird.v;
      if (frame % 90 === 1) pipes.push({ x: W, top: 50 + Math.random() * (H - GAP - 100), scored: false });
      for (const p of pipes) {
        p.x -= SPEED;
        if (!p.scored && p.x + PW < bird.x) { p.scored = true; score++; }
        const by = p.top + GAP;
        const inTrunk = bird.x + R > p.x + 14 && bird.x - R < p.x + PW - 14;
        const inCanopy = bird.x + R > p.x + 7 && bird.x - R < p.x + PW - 7;
        if ((inTrunk && (bird.y - R < p.top || bird.y + R > by)) ||
            (inCanopy && ((bird.y + R > p.top - 40 && bird.y - R < p.top) || (bird.y + R > by && bird.y - R < by + 40)))) die();
      }
      pipes = pipes.filter(p => p.x > -PW);
      if (bird.y - R < 0 || bird.y + R > H) die();
    }

    function canopy(cx, cy, s) {
      const L = [[-12, 2, 13, "#f0a81a"], [12, 2, 13, "#f0a81a"], [0, -6, 15, "#f6c21c"], [0, 8, 12, "#f6c21c"], [-6, -2, 9, "#ffd84d"], [8, -4, 8, "#ffd84d"]];
      ctx.fillStyle = "#b9710a";
      for (const [dx, dy, r] of L) { ctx.beginPath(); ctx.arc(cx + dx * s, cy + dy * s, (r + 2) * s, 0, Math.PI * 2); ctx.fill(); }
      for (const [dx, dy, r, col] of L) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx + dx * s, cy + dy * s, r * s, 0, Math.PI * 2); ctx.fill(); }
    }

    function label(text, y, size) {
      ctx.fillStyle = INK; ctx.textAlign = "center";
      ctx.font = "800 " + size + "px " + FONT;
      ctx.fillText(text, W / 2, y);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#9fdcf0"); sky.addColorStop(1, "#dff4cf");
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
      // far mountains
      ctx.fillStyle = "#7fb8a0";
      ctx.beginPath(); ctx.moveTo(0, 300); ctx.lineTo(60, 230); ctx.lineTo(110, 280); ctx.lineTo(180, 200);
      ctx.lineTo(250, 270); ctx.lineTo(W, 225); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#f4fbf6";
      ctx.beginPath(); ctx.moveTo(60, 230); ctx.lineTo(48, 247); ctx.lineTo(56, 244); ctx.lineTo(62, 250); ctx.lineTo(70, 243); ctx.lineTo(74, 246); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(180, 200); ctx.lineTo(164, 224); ctx.lineTo(173, 220); ctx.lineTo(181, 228); ctx.lineTo(190, 219); ctx.lineTo(196, 224); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#6cc07a";
      ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, H - 70);
      ctx.quadraticCurveTo(80, H - 130, 170, H - 80); ctx.quadraticCurveTo(250, H - 40, W, H - 90);
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
      // brewery (generic, no logo)
      const fy = H - 60;
      for (const tx of [182, 212]) {
        ctx.fillStyle = "#c9d2d8"; ctx.strokeStyle = "#7d8a94"; ctx.lineWidth = 2;
        ctx.fillRect(tx, fy - 62, 24, 62); ctx.strokeRect(tx, fy - 62, 24, 62);
        ctx.beginPath(); ctx.ellipse(tx + 12, fy - 62, 12, 6, 0, Math.PI, 0); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.fillRect(tx + 4, fy - 58, 4, 54);
      }
      ctx.fillStyle = "#a8452f"; ctx.strokeStyle = "#7c2f20"; ctx.lineWidth = 2;
      ctx.fillRect(140, fy - 150, 16, 84); ctx.strokeRect(140, fy - 150, 16, 84);
      ctx.fillStyle = "#f1e4d0";
      ctx.fillRect(140, fy - 132, 16, 5); ctx.fillRect(140, fy - 112, 16, 5);
      ctx.fillStyle = "#b5503a";
      ctx.fillRect(38, fy - 70, 136, 70); ctx.strokeRect(38, fy - 70, 136, 70);
      ctx.fillStyle = "#8c3a28";
      ctx.beginPath(); ctx.moveTo(38, fy - 70);
      for (let k = 0; k < 4; k++) { ctx.lineTo(38 + k * 34, fy - 84); ctx.lineTo(38 + (k + 1) * 34, fy - 70); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#ffe9a8";
      for (let r = 0; r < 2; r++) for (let k = 0; k < 6; k++) ctx.fillRect(48 + k * 21, fy - 58 + r * 24, 11, 14);
      ctx.fillStyle = "#5a2a1c"; ctx.fillRect(100, fy - 22, 18, 22);
      ctx.fillStyle = "#f6c21c"; ctx.fillRect(66, fy - 99, 80, 15); ctx.strokeRect(66, fy - 99, 80, 15);
      ctx.fillStyle = "#7c2f20"; ctx.font = "800 10px " + FONT; ctx.textAlign = "center";
      ctx.fillText("BREWERY", 106, fy - 88);
      for (let k = 0; k < 4; k++) {
        const t = (frame * 0.35 + k * 22) % 88;
        ctx.fillStyle = "rgba(255,255,255," + (0.75 - t / 130).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(148 + t * 0.25 + Math.sin(t / 9 + k) * 3, fy - 154 - t, 5 + t / 12, 0, Math.PI * 2); ctx.fill();
      }
      // background aspens
      for (const [ax, ah] of [[14, 70], [270, 80], [296, 58], [250, 52]]) {
        const base = H - 50;
        ctx.fillStyle = "#f4f1e6"; ctx.fillRect(ax - 3, base - ah, 6, ah);
        ctx.fillStyle = "#4a4a46";
        ctx.fillRect(ax - 3, base - ah + 14, 6, 2); ctx.fillRect(ax - 3, base - ah + 34, 6, 2);
        canopy(ax, base - ah - 6, 0.55);
      }
      ctx.fillStyle = "#4fae66";
      ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, H - 35);
      ctx.quadraticCurveTo(100, H - 75, 200, H - 40); ctx.quadraticCurveTo(270, H - 20, W, H - 45);
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = "#5b574d";
      for (const p of pipes) {
        const by = p.top + GAP, tx = p.x + 14, tw = PW - 28;
        ctx.fillStyle = "#f4f1e6";
        ctx.fillRect(tx, -3, tw, p.top + 3); ctx.strokeRect(tx, -3, tw, p.top + 3);
        ctx.fillRect(tx, by, tw, H - by + 3); ctx.strokeRect(tx, by, tw, H - by + 3);
        ctx.fillStyle = "#3d3b36";
        for (let y = 8, k = 0; y < p.top - 30; y += 26, k++) ctx.fillRect(tx + 2 + (k % 2) * 9, y, 9, 3);
        for (let y = by + 50, k = 0; y < H; y += 26, k++) ctx.fillRect(tx + 2 + (k % 2) * 9, y, 9, 3);
        canopy(p.x + PW / 2, p.top - 20, 1);
        canopy(p.x + PW / 2, by + 20, 1);
      }
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(Math.max(-0.5, Math.min(1, bird.v / 10)));
      ctx.scale(1.3, 1.3);
      ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.lineWidth = 2; ctx.strokeStyle = INK;
      const flapping = state === "play";
      const wa = flapping ? Math.sin(frame / 3) * 0.7 : Math.sin(frame / 8) * 0.3;
      // legs and toes
      ctx.strokeStyle = "#f2a21d"; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-3, 11); ctx.lineTo(-4, 17); ctx.moveTo(-4, 17); ctx.lineTo(-8, 18); ctx.moveTo(-4, 17); ctx.lineTo(-1, 19);
      ctx.moveTo(5, 11); ctx.lineTo(5, 17); ctx.moveTo(5, 17); ctx.lineTo(1, 18); ctx.moveTo(5, 17); ctx.lineTo(8, 19);
      ctx.stroke();
      ctx.lineWidth = 2; ctx.strokeStyle = INK;
      // tail fan
      for (const [col, ang] of [["#2a9fb5", -0.45], ["#e0457b", 0.45], ["#ff9a3c", 0]]) {
        ctx.save(); ctx.translate(-13, 1); ctx.rotate(ang);
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.ellipse(-11, 0, 12, 4.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      // head crest
      for (const [ang, len, col] of [[-0.5, 11, "#2a9fb5"], [0, 14, "#e0457b"], [0.5, 11, "#ff9a3c"]]) {
        ctx.save(); ctx.translate(5, -12); ctx.rotate(ang - 0.3);
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.ellipse(0, -len / 2, 3.2, len / 2, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      // body
      const bg = ctx.createRadialGradient(-4, -6, 2, 0, 0, 20);
      bg.addColorStop(0, "#ff9a5a"); bg.addColorStop(1, "#e8452e");
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI * 2); ctx.fill();
      // belly with feather scallops
      ctx.save();
      ctx.beginPath(); ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = "#ffeab5";
      ctx.beginPath(); ctx.ellipse(6, 9, 15, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(200,120,60,.5)"; ctx.lineWidth = 1.2;
      for (const [x, y] of [[2, 6], [8, 8], [14, 6], [5, 11], [11, 12]]) {
        ctx.beginPath(); ctx.arc(x, y, 3, 0.2, Math.PI - 0.2); ctx.stroke();
      }
      ctx.restore();
      ctx.strokeStyle = INK; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI * 2); ctx.stroke();
      // wing
      ctx.save(); ctx.translate(-4, 0); ctx.rotate(wa);
      ctx.fillStyle = "#2a9fb5";
      ctx.beginPath(); ctx.moveTo(4, -3); ctx.quadraticCurveTo(-4, -12, -17, -4);
      ctx.quadraticCurveTo(-14, 3, -18, 8); ctx.quadraticCurveTo(-6, 10, 4, 5);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "rgba(27,42,107,.45)"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-3, -1); ctx.lineTo(-13, -1); ctx.moveTo(-3, 3); ctx.lineTo(-14, 5); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = INK; ctx.lineWidth = 2;
      // beak (opens a bit on flap)
      const open = flapping && bird.v < 0 ? 3 : 0;
      ctx.fillStyle = "#ffb02e";
      ctx.beginPath(); ctx.moveTo(14, -4); ctx.quadraticCurveTo(24, -3, 27, 1); ctx.lineTo(14, 2); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#f08a14";
      ctx.beginPath(); ctx.moveTo(14, 2); ctx.lineTo(25, 2 + open); ctx.lineTo(15, 6 + open); ctx.closePath(); ctx.fill(); ctx.stroke();
      // cheek and eye
      ctx.fillStyle = "rgba(255,120,150,.6)";
      ctx.beginPath(); ctx.arc(8, 4, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(9, -5, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(10.5, -5, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(11.6, -6.3, 1.1, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      if (state === "play") label(String(score), 56, 44);
      if (state === "ready") { label("Tap to start", 150, 28); label("Best: " + best, 185, 18); }
      if (state === "over") {
        label("Game over", 190, 34);
        label("Score " + score + " \u2022 Best " + best, 225, 18);
        label("Tap to try again", 258, 18);
      }
    }

    let last = performance.now(), acc = 0;
    const STEP = 1000 / 60;
    function loop(now) {
      acc += Math.min(now - last, 100); last = now;
      while (acc >= STEP) { update(); acc -= STEP; }
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    c.addEventListener("pointerdown", e => { e.preventDefault(); flap(); });
    document.addEventListener("keydown", e => {
      if (e.code === "Space" && e.target === document.body) { e.preventDefault(); flap(); }
      if (e.code === "ArrowUp") { e.preventDefault(); flap(); }
    });
  })();
</script>
</body>
</html>
